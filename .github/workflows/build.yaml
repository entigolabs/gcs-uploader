name: Build and Push

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

jobs:
  version:
    name: Get next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get next version
        id: version
        run: |
          LATEST=$(git tag -l 'v*' | sort -V | tail -n1)
          if [ -z "$LATEST" ]; then
            NEXT="v0.0.1"
          else
            NEXT=$(echo "$LATEST" | awk -F. '{print $1"."$2"."$3+1}')
          fi
          echo "version=$NEXT" >> $GITHUB_OUTPUT
          echo "Next version: $NEXT"

  build:
    name: Build ${{ matrix.image }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: ghcr.io/entigolabs/gcs-uploader
            file: Dockerfile
          - image: ghcr.io/entigolabs/gcs-uploader-gcloud
            file: Dockerfile.gcloud
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.file }}
          cache-to: type=gha,mode=max,scope=${{ matrix.file }}

  release:
    name: Create release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create tag and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a ${{ needs.version.outputs.version }} -m "Release ${{ needs.version.outputs.version }}"
          git push origin ${{ needs.version.outputs.version }}
          gh release create ${{ needs.version.outputs.version }} \
            --title "Release ${{ needs.version.outputs.version }}" \
            --generate-notes